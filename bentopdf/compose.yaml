services:

  bentopdf:
    # Self-hosted build: all PDF tools, no marketing chrome.
    # Supports amd64. If running on arm64 (Raspberry Pi 5), test first —
    # the official image may need --platform linux/amd64 with QEMU emulation.
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: bentopdf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - traefik.enable=true
      # Middleware: inject COOP/COEP headers required for Office-file conversions
      # (Word, Excel, PowerPoint → PDF). Safe to leave in place even if unused.
      - traefik.http.middlewares.bentopdf-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.bentopdf-headers.headers.customResponseHeaders.Cross-Origin-Embedder-Policy=require-corp
      # HTTP → HTTPS redirect
      - traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.bentopdf-http.rule=Host(`bentopdf.internal.anantagarwal.me`)
      - traefik.http.routers.bentopdf-http.entrypoints=web
      - traefik.http.routers.bentopdf-http.middlewares=traefik-https-redirect
      # HTTPS with Cloudflare cert + security headers middleware
      - traefik.http.routers.bentopdf-https.rule=Host(`bentopdf.internal.anantagarwal.me`)
      - traefik.http.routers.bentopdf-https.entrypoints=websecure
      - traefik.http.routers.bentopdf-https.tls=true
      - traefik.http.routers.bentopdf-https.tls.certresolver=cloudflare
      - traefik.http.routers.bentopdf-https.middlewares=bentopdf-headers
      - traefik.http.services.bentopdf.loadbalancer.server.port=8080

networks:
  default:
    name: homelab-network
    external: true
