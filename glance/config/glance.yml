# Glance Configuration File
# Fully declarative, easy to backup and modify.
# For more info: https://github.com/glanceapp/glance

theme:
  background-color: 240 21 15
  contrast-multiplier: 1.2
  primary-color: 217 92 83
  positive-color: 115 54 76
  negative-color: 347 70 65

pages:
  - name: Homelab
    slug: home
    columns:
      # Column 1: Widgets, Tools, Weather
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezone: Asia/Kolkata

          - type: weather
            location: Bengaluru, India
            units: metric
            hour-format: 24h

          - type: search
            search-engine: google
            autofocus: true
            new-tab: true
            bangs:
              - title: Google
                shortcut: "!g"
                url: https://google.com/search?q={QUERY}
              - title: GitHub
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}
              - title: YouTube
                shortcut: "!yt"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: Wikipedia
                shortcut: "!w"
                url: https://en.wikipedia.org/wiki/{QUERY}

          - type: server-stats
            servers:
              - type: local
                name: Pi 5

      # Column 2: Service Health & Bookmarks
      - size: full
        widgets:
          - type: monitor
            title: Service Health
            sites:
              - title: Traefik
                url: https://traefik.internal.anantagarwal.me
                icon: mdi:router-wireless
              - title: BentoPDF
                url: https://bentopdf.internal.anantagarwal.me
                icon: mdi:file-pdf-box
              - title: Docling
                url: https://docling.internal.anantagarwal.me/ui
                icon: mdi:file-sync
              - title: Dockhand
                url: https://dockhand.internal.anantagarwal.me
                icon: mdi:docker
              - title: Paperless-NGX
                url: https://paperless.internal.anantagarwal.me
                icon: mdi:archive
              - title: Glance Dashboard
                url: https://home.internal.anantagarwal.me
                icon: mdi:view-dashboard
              - title: Home Apartment
                url: https://aeaoa.anantagarwal.me/
                icon: mdi:office-building

          - type: bookmarks
            title: Core Services
            groups:
              - title: Apps
                links:
                  - title: Traefik
                    url: https://traefik.internal.anantagarwal.me
                    icon: mdi:router-wireless
                  - title: BentoPDF
                    url: https://bentopdf.internal.anantagarwal.me
                    icon: mdi:file-pdf-box
                  - title: Docling
                    url: https://docling.internal.anantagarwal.me/ui
                    icon: mdi:file-sync
                  - title: Dockhand
                    url: https://dockhand.internal.anantagarwal.me
                    icon: mdi:docker
                  - title: Paperless-NGX
                    url: https://paperless.internal.anantagarwal.me
                    icon: mdi:archive
                  - title: Home Apartment
                    url: https://aeaoa.anantagarwal.me/
                    icon: mdi:office-building

      # Column 3: Indian Stock Markets & Exchange Rates
      - size: full
        widgets:
          - type: markets
            title: Indian Stock Markets
            markets:
              - symbol: "^NSEI"
                name: Nifty 50
              - symbol: "^BSESN"
                name: BSE Sensex

          - type: markets
            title: Exchange Rates (INR)
            markets:
              - symbol: "USDINR=X"
                name: USD / INR
              - symbol: "SGDINR=X"
                name: SGD / INR
              - symbol: "GBPINR=X"
                name: GBP / INR
              - symbol: "AUDINR=X"
                name: AUD / INR

  - name: News & Feeds
    slug: feeds
    columns:
      # Column 1: Dev News & Videos
      - size: full
        widgets:
          - type: hacker-news
            title: Hacker News
            limit: 8
          - type: videos
            title: Tech Creators
            channels:
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UC-yP2p3GkWn8ZmrUUn_d2WA # Hardware Haven
              - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips

      # Column 2: Segregated Tech & Self-Hosting Blogs
      - size: full
        widgets:
          - type: rss
            title: Java & Spring Development
            limit: 4
            feeds:
              - url: https://spring.io/blog.atom
                title: Spring Framework
              - url: https://inside.java/feed.xml
                title: Inside Java

          - type: rss
            title: Infrastructure & Database
            limit: 4
            feeds:
              - url: https://kubernetes.io/feed.xml
                title: Kubernetes
              - url: https://www.docker.com/blog/feed/
                title: Docker
              - url: https://www.postgresql.org/news/pgsql.rss
                title: PostgreSQL

          - type: rss
            title: Self-Hosting
            limit: 4
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
